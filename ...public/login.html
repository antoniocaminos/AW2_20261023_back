<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-lg border-0 rounded-4 animate-card">
                    <div class="card-header bg-gradient-primary text-white text-center rounded-top-4 py-4">
                        <i class="fas fa-users fa-3x mb-3"></i>
                        <h3 class="mb-0">Sistema de Usuarios</h3>
                        <small class="opacity-75">Inicia sesión para acceder al panel</small>
                    </div>

                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-2"></i>Correo Electrónico
                                </label>
                                <input type="email"
                                       class="form-control form-control-lg"
                                       id="email"
                                       name="email"
                                       required
                                       placeholder="ejemplo@correo.com">
                                <div class="invalid-feedback">Por favor ingresa un correo válido</div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Contraseña
                                </label>
                                <input type="password"
                                       class="form-control form-control-lg"
                                       id="password"
                                       name="password"
                                       required
                                       placeholder="Ingresa tu contraseña">
                                <div class="invalid-feedback">La contraseña es requerida</div>
                            </div>

                            <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3" id="loginBtn">
                                <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </form>

                        <div class="position-relative my-4">
                            <hr>
                            <div class="position-absolute top-50 start-50 translate-middle bg-white px-3">
                                <small class="text-muted">Credenciales de prueba</small>
                            </div>
                        </div>

                        <div class="row text-center">
                            <div class="col-12">
                                <div class="credential-card p-2 rounded"
                                     data-email="ana.martinez@email.com"
                                     data-pass="contrasenia1234">
                                    <small class="text-muted d-block">
                                        <i class="fas fa-user me-1"></i>Ana Martínez
                                    </small>
                                    <small class="d-block text-primary">ana.martinez@email.com</small>
                                    <small class="d-block text-muted">contraseña1234</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <small class="text-white-50">
                        <i class="far fa-copyright me-1"></i>2025 Sistema de Usuarios
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
