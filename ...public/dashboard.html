<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- Header -->
    <div class="dashboard-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2><i class="fas fa-tachometer-alt me-2"></i>Panel de Control</h2>
                    <p class="mb-0 opacity-75">Gestión de usuarios</p>
                </div>
                <div class="col-md-6 text-end">
                    <div class="d-flex justify-content-end align-items-center gap-3">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="text-start">
                            <strong id="userName">Usuario</strong><br>
                            <small id="userEmail" class="opacity-75"></small>
                        </div>
                        <button id="logoutBtn" class="btn btn-light">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container pb-5">

        <!-- KPIs -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Total Usuarios</h6>
                                <h2 id="totalUsuarios" class="mb-0">0</h2>
                            </div>
                            <div class="stat-icon"><i class="fas fa-users"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Edad Promedio</h6>
                                <h2 id="edadPromedio" class="mb-0">0</h2>
                            </div>
                            <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Ocupaciones</h6>
                                <h2 id="totalOcupaciones" class="mb-0">0</h2>
                            </div>
                            <div class="stat-icon"><i class="fas fa-briefcase"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Ciudades</h6>
                                <h2 id="totalCiudades" class="mb-0">0</h2>
                            </div>
                            <div class="stat-icon"><i class="fas fa-map-marker-alt"></i></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h5 class="mb-0"><i class="fas fa-list me-2"></i>Lista de Usuarios</h5>
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control form-control-sm" id="filtro"
                               placeholder="Buscar..." style="width:200px">
                        <button class="btn btn-primary btn-sm" id="nuevoBtn">
                            <i class="fas fa-plus me-1"></i>Nuevo
                        </button>
                        <button class="btn btn-outline-secondary btn-sm" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th class="d-none d-md-table-cell">Edad</th>
                                <th class="d-none d-lg-table-cell">Ocupación</th>
                                <th class="d-none d-lg-table-cell">Ciudad</th>
                                <th>Email</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosTable">
                            <tr>
                                <td colspan="7" class="text-center py-4">
                                    <div class="spinner-border text-primary"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white text-muted small" id="tablaFooter">Cargando...</div>
        </div>
    </div>

    <!-- Modal Crear/Editar -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Nuevo usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form id="formUsuario">
                    <div class="modal-body">
                        <input type="hidden" id="formId">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Nombre *</label>
                                <input type="text" class="form-control" id="formNombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Edad *</label>
                                <input type="number" class="form-control" id="formEdad" min="0" max="120" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Ocupación *</label>
                                <input type="text" class="form-control" id="formOcupacion" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Ciudad natal *</label>
                                <input type="text" class="form-control" id="formCiudadNatal" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Dirección *</label>
                                <input type="text" class="form-control" id="formDireccion" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email *</label>
                                <input type="email" class="form-control" id="formEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">
                                    Contraseña * <span class="text-muted">(mín. 8)</span>
                                </label>
                                <input type="text" class="form-control" id="formPass" minlength="8">
                            </div>
                        </div>

                        <div id="modalFeedback" class="mt-3"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">
                            <i class="fas fa-check me-1"></i>Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
